[package]
name = "speedconquest"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
description = "Conquistas offline estilo PS5 para Need for Speed Underground 2 rodando no Wine (Linux)"
license = "MIT"
repository = "https://github.com/1155dosilicon/speedconquest"
publish = false

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "x11", "default_fonts"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
tiny-skia = "0.12.0"
toml = "1.2.2"
x11rb = "0.14.0"
